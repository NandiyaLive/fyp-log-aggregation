[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/log-workload-*_default_emitter-*.log
    Parser            cri
    DB                /fluent-bit/state/kube.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# Parse the workload's JSON log payload into root fields. Replaces the
# kubernetes filter for this purpose: no apiserver call per record, no
# metadata enrichment. Pipeline A does not need pod metadata.
[FILTER]
    Name         parser
    Match        kube.*
    Key_Name     log
    Parser       workload_json
    Reserve_Data On

[OUTPUT]
    Name            opensearch
    Match           kube.*
    Host            opensearch-cluster-master.logging.svc.cluster.local
    Port            9200
    Index           logs
    Suppress_Type_Name On
    Trace_Error     On
    Retry_Limit     2
    Buffer_Size     8MB
    Workers         1
