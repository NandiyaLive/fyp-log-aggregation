[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/log-workload-*_default_emitter-*.log
    Parser            docker
    DB                /tmp/fluent-bit-kube.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Merge_Log           On
    Keep_Log            Off

[FILTER]
    Name          nest
    Match         kube.*
    Operation     lift
    Nested_under  kubernetes
    Add_prefix    k8s_

[FILTER]
    Name          nest
    Match         kube.*
    Operation     lift
    Nested_under  log
    Add_prefix    log_

[OUTPUT]
    Name            opensearch
    Match           kube.*
    Host            opensearch-cluster-master.logging.svc.cluster.local
    Port            9200
    Index           logs
    Suppress_Type_Name On
    Trace_Error     On
