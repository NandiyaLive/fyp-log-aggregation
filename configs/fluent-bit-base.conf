[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    # Filesystem buffering: when OpenSearch lags, chunks spill to disk instead
    # of pausing the tail input. A paused tail lets kubelet rotate and delete
    # container logs before they are read -> permanent loss. The buffer lives on
    # a pod-local emptyDir (/fluent-bit/buffer), so it is destroyed when the pod
    # is deleted -> an injected Fluent Bit kill stays a clean, permanent loss.
    storage.type              filesystem
    storage.path              /fluent-bit/buffer
    storage.max_chunks_up     256
    storage.backlog.mem_limit 64M
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/log-workload-*_default_emitter-*.log
    Parser            cri
    DB                /fluent-bit/state/kube.db
    storage.type      filesystem
    Skip_Long_Lines   On
    Refresh_Interval  1
    Rotate_Wait       30

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Merge_Log           On
    Keep_Log            Off

[FILTER]
    Name          nest
    Match         kube.*
    Operation     lift
    Nested_under  kubernetes
    Add_prefix    k8s_

[FILTER]
    Name          nest
    Match         kube.*
    Operation     lift
    Nested_under  log
    Add_prefix    log_

[OUTPUT]
    Name            opensearch
    Match           kube.*
    Host            opensearch-cluster-master.logging.svc.cluster.local
    Port            9200
    Index           logs
    Suppress_Type_Name On
    storage.total_limit_size 5G
    Trace_Error     On
