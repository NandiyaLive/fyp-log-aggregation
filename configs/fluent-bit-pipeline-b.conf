[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/log-workload-*_default_emitter-*.log
    Parser            cri
    DB                /fluent-bit/state/kube.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# JSON-merge the workload log payload into root so the Lua dedup callback can
# read message/level/component. Drops the kubernetes filter to avoid the
# per-record apiserver enrichment hop (60-180s saved per 1M-line run).
[FILTER]
    Name         parser
    Match        kube.*
    Key_Name     log
    Parser       workload_json
    Reserve_Data On

[FILTER]
    Name    lua
    Match   kube.*
    script  /fluent-bit/etc/semantic_aggregate.lua
    call    cb_dedup
    protected_mode true

[OUTPUT]
    Name            opensearch
    Match           kube.*
    Host            opensearch-cluster-master.logging.svc.cluster.local
    Port            9200
    Index           logs-edge
    Suppress_Type_Name On
    Write_Operation upsert
    Id_Key          _agg_id
    Trace_Error     On
    Retry_Limit     2
    Buffer_Size     8MB
    Workers         1
