[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/log-workload-*_default_emitter-*.log
    Parser            cri
    DB                /tmp/fluent-bit-kube.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name                kubernetes
    Match               kube.*
    Merge_Log           On
    Keep_Log            Off

[FILTER]
    Name    lua
    Match   kube.*
    script  /fluent-bit/etc/generate_agg_id.lua
    call    cb_generate_id

[OUTPUT]
    Name            opensearch
    Match           kube.*
    Host            opensearch-cluster-master.logging.svc.cluster.local
    Port            9200
    Index           logs-index
    Suppress_Type_Name On
    Write_Operation upsert
    Id_Key          _agg_id
    Trace_Error     On
