clusterName: opensearch-cluster
nodeGroup: master
masterService: opensearch-cluster-master
singleNode: true
replicas: 1

config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    plugins.security.disabled: true
    discovery.type: single-node

# JVM heap. Kept at half the 4Gi container limit, leaving room for off-heap
# Lucene buffers; sized for an 8 GB droplet shared with k3s and Fluent Bit.
opensearchJavaOpts: "-Xmx2g -Xms2g"

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "1000m"
    memory: "4Gi"

persistence:
  enabled: true
  size: 100Gi
  accessModes:
    - ReadWriteOnce

service:
  type: ClusterIP
  port: 9200
